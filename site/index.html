<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b5d3b">
  <title>Enviar para Bracomil</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">BRACOMIL</div>
      <h1>Enviar documento</h1>
      <p>Compartilhe do WhatsApp ou selecione um arquivo manualmente.</p>
    </header>

    <section class="card">
      <form id="docForm">
        <label>Cliente / Fornecedor
          <input id="party" name="party" autocomplete="organization" placeholder="Nome do cliente ou fornecedor" required>
        </label>

        <label>Categoria
          <select id="category" name="category" required>
            <option value="">Selecione</option>
            <option>Nota fiscal</option>
            <option>Pedido</option>
            <option>Comprovante</option>
            <option>Foto</option>
            <option>Documento</option>
            <option>Outros</option>
          </select>
        </label>

        <label>Observação
          <textarea id="notes" name="notes" rows="3" placeholder="Opcional"></textarea>
        </label>

        <label>Arquivo
          <input id="fileInput" type="file" accept="image/*,application/pdf">
        </label>

        <div id="fileInfo" class="file-info">Nenhum arquivo selecionado.</div>
        <img id="preview" class="preview" alt="Pré-visualização" hidden>

        <button id="sendButton" type="submit">ENVIAR</button>
        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <iframe id="uploadFrame" name="uploadFrame" hidden></iframe>
  <form id="uploadForm" method="POST" target="uploadFrame" hidden>
    <input name="party" id="upParty">
    <input name="category" id="upCategory">
    <input name="notes" id="upNotes">
    <input name="fileName" id="upFileName">
    <input name="mimeType" id="upMimeType">
    <textarea name="base64" id="upBase64"></textarea>
  </form>

  <script src="./app.js"></script>
</body>
</html>
