<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b5d3b">
  <title>Enviar para Bracomil</title>

  <link rel="manifest" href="./manifest.webmanifest?v=19">
  <link rel="stylesheet" href="./styles.css?v=19">
</head>

<body>
  <main class="shell">
    <header>
      <div class="brand">BRACOMIL</div>
      <h1>Enviar comprovante</h1>
      <p>Compartilhe do WhatsApp ou selecione um arquivo manualmente.</p>
      <button id="tokenButton" class="link-button" type="button">Configurar chave</button>
    </header>

    <section class="card">
      <form id="docForm" novalidate>
        <label>
          Cliente / Fornecedor
          <input
            id="party"
            name="party"
            autocomplete="organization"
            placeholder="Nome do cliente ou fornecedor"
            required
          >
        </label>

        <label>
          Origem do comprovante
          <select id="category" name="category" required>
            <option value="">Selecione</option>
            <option value="Pedido de Venda">Pedido de Venda</option>
            <option value="Nota Fiscal">Nota Fiscal</option>
            <option value="Outros">Outros</option>
          </select>
        </label>

        <label>
          Identificador
          <small>
            Para pedido de venda ou nota fiscal, informe o número.
            Para outros, use uma identificação que permita localizar o registro.
          </small>
          <input
            id="numero_documento"
            name="numero_documento"
            type="text"
            value="0"
            placeholder="0 quando não houver número"
            required
          >
        </label>

        <label>
          Forma de Pagamento
          <select id="paymentMethod" name="paymentMethod" required>
            <option value="">Selecione</option>
            <option value="PIX">PIX</option>
            <option value="Cartão">Cartão</option>
            <option value="Espécie">Espécie</option>
            <option value="Cheque">Cheque</option>
            <option value="Boleto">Boleto</option>
            <option value="Outro">Outro</option>
          </select>
        </label>

        <label>
          Valor
          <input
            id="amount"
            name="amount"
            type="text"
            inputmode="decimal"
            placeholder="R$ 0,00"
            required
          >
        </label>

        <label>
          Observação
          <textarea id="notes" name="notes" rows="3" placeholder="Opcional"></textarea>
        </label>

        <label>
          Comprovante / Arquivo
          <small>Opcional somente para pagamento em espécie.</small>
          <input id="fileInput" type="file" accept="image/*,application/pdf">
        </label>

        <div id="fileInfo" class="file-info">Nenhum arquivo selecionado.</div>
        <img id="preview" class="preview" alt="Pré-visualização" hidden>

        <button id="sendButton" type="submit">ENVIAR</button>
        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <footer class="app-footer">
      <span>Bracomil Share</span>
      <span id="appVersion">v19</span>
    </footer>
  </main>

  <div id="successModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="successTitle">
      <h2 id="successTitle">ENVIADO COM SUCESSO!</h2>
      <button id="successOk" type="button">OK</button>
    </div>
  </div>

  <div id="tokenModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="tokenTitle">
      <h2 id="tokenTitle">Chave da aplicação</h2>
      <p class="modal-help">Informe a chave fornecida pelo administrador da Bracomil.</p>
      <input id="tokenInput" type="password" autocomplete="off" placeholder="Chave/token">
      <div class="modal-actions">
        <button id="tokenSave" type="button">SALVAR</button>
        <button id="tokenCancel" class="secondary" type="button">CANCELAR</button>
      </div>
    </div>
  </div>

  <script src="./app.js?v=19"></script>
</body>
</html>
